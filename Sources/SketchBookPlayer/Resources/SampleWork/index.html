<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sample Work</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #070b14;
      }

      body {
        font-family: "SF Pro Display", sans-serif;
      }

      .label {
        position: fixed;
        left: 18px;
        bottom: 16px;
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        mix-blend-mode: screen;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="label">Bundled Sample</div>
    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      let width = 0;
      let height = 0;
      let time = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function draw() {
        time += 0.008;
        ctx.clearRect(0, 0, width, height);

        const gradient = ctx.createLinearGradient(0, 0, width, height);
        gradient.addColorStop(0, "#0d1322");
        gradient.addColorStop(0.5, "#0d3551");
        gradient.addColorStop(1, "#261320");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        const count = 64;
        for (let i = 0; i < count; i++) {
          const t = time + i * 0.12;
          const x = width * 0.5 + Math.cos(t * 0.9) * width * 0.25 + Math.sin(t * 1.7) * 60;
          const y = height * 0.5 + Math.sin(t * 1.1) * height * 0.25 + Math.cos(t * 1.9) * 60;
          const radius = 24 + Math.sin(t * 2.3) * 10;

          ctx.beginPath();
          ctx.fillStyle = `hsla(${(t * 90 + i * 7) % 360}, 90%, 68%, 0.14)`;
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      resize();
      draw();
    </script>
  </body>
</html>
